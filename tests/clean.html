<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Склад</title>
<style>
:root{--bg:#f3f1ec;--text:#1d2320;--muted:#5d6661;--accent:#2f6b4f;--line:#d6d2c8}
body{background:var(--bg);color:var(--text);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
button{border:1px solid var(--line);border-radius:4px;background:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none}}
</style></head>
<body><h1>Остатки на складе</h1><p>Обновлено в 09:40. Пустых позиций нет; при ошибке загрузки страница покажет причину.</p>
<table><tr><th>Позиция</th><th>Остаток, шт.</th></tr><tr><td>TD-BLE</td><td>120</td></tr></table></body></html>
